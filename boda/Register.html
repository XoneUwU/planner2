<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Wedding Planner</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f6fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .register-container {
            background: #fff;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        h2 { color: #333; margin-bottom: 20px; }
        
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            transition: border 0.3s;
        }
        input:focus { border-color: #3498db; outline: none; }

        button {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 20px;
        }

        .btn-next {
            background-color: #3498db;
            color: white;
            float: right;
        }
        .btn-next:hover { background-color: #2980b9; }

        .btn-register {
            background-color: #2ecc71;
            color: white;
            width: 100%;
        }
        .btn-register:hover { background-color: #27ae60; }
        .btn-register:disabled { background-color: #ccc; cursor: not-allowed; }

        .btn-back {
            position: absolute;
            top: 20px;
            left: 20px;
            background: transparent;
            color: #777;
            font-weight: bold;
            padding: 5px 10px;
            cursor: pointer;
        }
        .btn-back:hover { color: #333; }

        /* --- SECCIONES (PASOS) --- */
        .step { display: none; animation: fadeIn 0.5s; }
        .step.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* --- GRID DE COLORES --- */
        .color-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-top: 20px;
            margin-bottom: 20px;
        }

        .color-box {
            height: 70px;
            border-radius: 10px;
            cursor: pointer;
            position: relative;
            box-shadow: 0 3px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }

        .color-box:hover { transform: scale(1.05); }
        .color-box.white { border: 1px solid #ddd; }

        .color-box.selected {
            border: 4px solid #2ecc71;
            transform: scale(0.95);
        }

        .check-icon {
            display: none;
            position: absolute;
            top: -8px;
            right: -8px;
            background: #2ecc71;
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 14px;
            justify-content: center;
            align-items: center;
        }
        .color-box.selected .check-icon { display: flex; }

        .link { margin-top: 20px; font-size: 14px; }
        .link a { color: #3498db; text-decoration: none; }

        #message { margin-top: 15px; font-weight: bold; }

    </style>
</head>
<body>

    <div class="register-container">
        
        <div id="step1" class="step active">
            <h2>Crear Cuenta</h2>
            <p style="color: #777; font-size: 0.9em;">Paso 1 de 2</p>
            
            <form id="formStep1">
                <input type="text" id="nombre" placeholder="Nombre completo" required>
                <input type="email" id="correo" placeholder="Correo electrónico" required>
                <input type="password" id="contrasena" placeholder="Contraseña" required>
                <input type="password" id="confirmarContrasena" placeholder="Confirmar contraseña" required>
                
                <div style="display: flex; gap: 10px;">
                    <input type="number" id="presupuesto" placeholder="Presupuesto ($)" required>
                    <input type="text" id="codigoPareja" placeholder="Cód. Pareja (Opcional)">
                </div>

                <button type="submit" class="btn-next">Siguiente &rarr;</button>
            </form>
            
            <div style="clear: both;"></div>
            <div class="link">
                ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
            </div>
        </div>

        <div id="step2" class="step">
            <button type="button" class="btn-back" onclick="irAlPaso1()">&larr; Volver</button>
            
            <h2>Escoge 2 Colores</h2>
            <p style="color: #777; font-size: 0.9em;">Para personalizar tu experiencia</p>

            <div class="color-grid">
                <div class="color-box" style="background: #0000FF;" onclick="seleccionarColor(this, 'Azul')"><div class="check-icon">✔</div></div>
                <div class="color-box" style="background: #008000;" onclick="seleccionarColor(this, 'Verde')"><div class="check-icon">✔</div></div>
                <div class="color-box" style="background: #800080;" onclick="seleccionarColor(this, 'Morado')"><div class="check-icon">✔</div></div>
                <div class="color-box" style="background: #FFD700;" onclick="seleccionarColor(this, 'Amarillo')"><div class="check-icon">✔</div></div>
                <div class="color-box" style="background: #FF0000;" onclick="seleccionarColor(this, 'Rojo')"><div class="check-icon">✔</div></div>
                <div class="color-box white" style="background: #FFFFFF;" onclick="seleccionarColor(this, 'Blanco')"><div class="check-icon">✔</div></div>
                <div class="color-box" style="background: #000000;" onclick="seleccionarColor(this, 'Negro')"><div class="check-icon">✔</div></div>
                <div class="color-box" style="background: #87CEEB;" onclick="seleccionarColor(this, 'Celeste')"><div class="check-icon">✔</div></div>
            </div>

            <p id="contadorColores" style="font-size: 14px; color: #555;">Seleccionados: 0 / 2</p>

            <button id="btnRegistrarFinal" class="btn-register" onclick="registrarUsuario()" disabled>
                Registrarse
            </button>
        </div>

        <div id="message"></div>
    </div>

<script>
    let datosUsuario = {};
    let coloresSeleccionados = [];

    // --- LÓGICA DEL PASO 1 ---
    document.getElementById('formStep1').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const nombre = document.getElementById('nombre').value;
        const correo = document.getElementById('correo').value;
        const contrasena = document.getElementById('contrasena').value;
        const confirmar = document.getElementById('confirmarContrasena').value;
        const presupuesto = document.getElementById('presupuesto').value;
        const codigoPareja = document.getElementById('codigoPareja').value;

        if(contrasena !== confirmar) {
            alert("Las contraseñas no coinciden");
            return;
        }

        datosUsuario = { nombre, correo, contrasena, presupuesto, codigoPareja };

        document.getElementById('step1').classList.remove('active');
        document.getElementById('step2').classList.add('active');
    });

    function irAlPaso1() {
        document.getElementById('step2').classList.remove('active');
        document.getElementById('step1').classList.add('active');
    }

    // --- LÓGICA DEL PASO 2 (COLORES) ---
    function seleccionarColor(elemento, nombreColor) {
        const index = coloresSeleccionados.indexOf(nombreColor);

        if(index > -1) {
            coloresSeleccionados.splice(index, 1);
            elemento.classList.remove('selected');
        } else {
            if(coloresSeleccionados.length < 2) {
                coloresSeleccionados.push(nombreColor);
                elemento.classList.add('selected');
            }
        }

        document.getElementById('contadorColores').innerText = `Seleccionados: ${coloresSeleccionados.length} / 2`;
        const btn = document.getElementById('btnRegistrarFinal');
        
        if(coloresSeleccionados.length === 2) {
            btn.disabled = false;
            btn.style.opacity = "1";
        } else {
            btn.disabled = true;
            btn.style.opacity = "0.5";
        }
    }

    // --- ENVÍO FINAL AL SERVIDOR ---
    async function registrarUsuario() {
        const messageDiv = document.getElementById('message');
        messageDiv.textContent = "Procesando...";
        
        const payload = {
            ...datosUsuario,
            codigo_pareja_input: datosUsuario.codigoPareja, // Mapeo importante para el backend
            colores: coloresSeleccionados
        };

        try {
            const response = await fetch('http://localhost:3000/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await response.json();

            if(response.ok) {
                messageDiv.style.color = 'green';
                messageDiv.textContent = "¡Registro Exitoso! Redirigiendo...";
                setTimeout(() => {
                    window.location.href = 'Login.html';
                }, 2000);
            } else {
                messageDiv.style.color = 'red';
                messageDiv.textContent = data.message;
            }

        } catch (error) {
            console.error(error);
            messageDiv.style.color = 'red';
            messageDiv.textContent = "Error al conectar con el servidor";
        }
    }
</script>

</body>
</html>
