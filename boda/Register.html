<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Wedding Planner</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* Quitamos el background de color sólido */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            position: relative; /* Necesario para posicionar el fondo */
            overflow: hidden;   /* Evita barras de scroll si el blur se sale un poco */
        }

        /* --- CAPA DEL FONDO (IMAGEN + BLUR) --- */
        body::before {
            content: "";
            position: fixed; /* Se queda fijo en la pantalla */
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1; /* Se pone DETRÁS del contenido */

            /* --- TU IMAGEN --- */
            /* Asegúrate de cambiar la ruta a tu imagen real */
            background-image: url('img/fondo-boda.jpg'); 
            background-size: cover;      /* Cubre toda la pantalla */
            background-position: center; /* Centra la imagen */
            background-repeat: no-repeat;

            /* --- EL EFECTO BLUR --- */
            filter: blur(1.5px); /* Cambia 8px para más o menos borroso */
            
            /* Truco Pro: Aumentamos un poco el tamaño para evitar bordes blancos difuminados */
            transform: scale(1.1); 
        }

        /* Opcional: Una capa oscura encima para que el formulario resalte más */
        body::after {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.3); /* Oscurece la imagen un 30% */
            z-index: -1;
        }

        .register-container {
            background: #fff;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        h2 { color: #333; margin-bottom: 20px; }
        
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            transition: border 0.3s;
        }
        input:focus { border-color: #3498db; outline: none; }

        button {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 20px;
        }

        .btn-next {
            background-color: #3498db;
            color: white;
            float: right;
        }
        .btn-next:hover { background-color: #2980b9; }

        .btn-register {
            background-color: #2ecc71;
            color: white;
            width: 100%;
        }
        .btn-register:hover { background-color: #27ae60; }
        .btn-register:disabled { background-color: #ccc; cursor: not-allowed; }

        .btn-back {
            position: absolute;
            top: 20px;
            left: 20px;
            background: transparent;
            color: #777;
            font-weight: bold;
            padding: 5px 10px;
            cursor: pointer;
        }
        .btn-back:hover { color: #333; }

        /* --- SECCIONES (PASOS) --- */
        .step { display: none; animation: fadeIn 0.5s; }
        .step.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* --- GRID DE COLORES --- */
        .color-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-top: 20px;
            margin-bottom: 20px;
        }

        .color-box {
            height: 100px; 
            width: 100%; /* Ocupa todo el ancho de su columna */
            border-radius: 10px;
            cursor: pointer;
            position: relative;
            box-shadow: 0 3px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s, border 0.2s;
            
            /* 2. Recorte: Lo que sobresalga del cuadro, se esconde */
            overflow: hidden; 
            
            /* Borde transparente para evitar saltos al seleccionar */
            border: 3px solid transparent; 
            box-sizing: border-box;
        }

        .color-box:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            z-index: 1; /* Pone el elemento hover encima de los demás */
        }

        /* --- LA IMAGEN DENTRO DEL CUADRO --- */
        .color-box img {
            width: 100%;
            height: 100%;
            
            /* 3. AJUSTE MAGICO: Cubre todo el cuadro sin estirarse/deformarse */
            object-fit: cover; 
            
            display: block; /* Quita el espacio en blanco debajo de las imágenes */
        }

                /* --- ESTADO SELECCIONADO --- */
        .color-box.selected {
            border: 3px solid #2ecc71; /* Borde verde */
            transform: scale(0.95);
        }

        .check-icon {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(46, 204, 113, 0.9);
            color: white;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            font-size: 18px;
            justify-content: center;
            align-items: center;
            z-index: 10;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        .color-box.selected .check-icon { display: flex; }
                /* --- TEXTO DEL COLOR (OPCIONAL) --- */
        .color-name {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.6); /* Fondo oscuro semitransparente */
            color: white;
            font-size: 12px;
            text-align: center;
            padding: 4px 0;
            font-weight: bold;
            text-shadow: 1px 1px 2px black; /* Sombra para leer mejor */
        }

        .link { margin-top: 20px; font-size: 14px; }
        .link a { color: #3498db; text-decoration: none; }

        #message { margin-top: 15px; font-weight: bold; }

    </style>
</head>
<body>

    <div class="register-container">
        <a href="home.html" style="position: absolute; top: 20px; left: 20px; text-decoration: none; color: #777; font-weight: bold;">
            &larr; Volver
        </a>
        <div id="step1" class="step active">
            <h2>Crear Cuenta</h2>
            <p style="color: #777; font-size: 0.9em;">Paso 1 de 2</p>
            
            <form id="formStep1">
                <input type="text" id="nombre" placeholder="Nombre completo" required>
                <input type="email" id="correo" placeholder="Correo electrónico" required>
                <input type="password" id="contrasena" placeholder="Contraseña" required>
                <input type="password" id="confirmarContrasena" placeholder="Confirmar contraseña" required>
                
                <div style="display: flex; gap: 10px;">
                    <input type="number" id="presupuesto" placeholder="Presupuesto ($)" required>
                    <input type="text" id="codigoPareja" placeholder="Cód. Pareja (Opcional)">
                </div>

                <button type="submit" class="btn-next">Siguiente &rarr;</button>
            </form>
            
            <div style="clear: both;"></div>
            <div class="link">
                ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
            </div>
        </div>
        <div id="step2" class="step">
            <button type="button" class="btn-back" onclick="irAlPaso1()">&larr; Volver</button>
            <h2>Escoge 2 Colores</h2>
            <p style="color: #777; font-size: 0.9em;">Para personalizar tu experiencia</p>

            <div class="color-grid">
                <div class="color-box" onclick="seleccionarColor(this, 'Rojo')">
                    <img src="img/rojo.jpg" alt="Rojo"> <div class="check-icon">✔</div>
                    <span class="color-name">Rojo</span> </div>

                <div class="color-box" onclick="seleccionarColor(this, 'Blanco')">
                    <img src="img/blanco.jpg" alt="Blanco">
                    <div class="check-icon">✔</div>
                <span class="color-name">Blanco</span>
            </div>

            <div class="color-box" onclick="seleccionarColor(this, 'Verde')">
                <img src="img/verde.jpg" alt="Verde">
                <div class="check-icon">✔</div>
                <span class="color-name">Verde</span>
            </div>

            <div class="color-box" onclick="seleccionarColor(this, 'Azul')">
                <img src="img/azul.jpg" alt="Azul">
                <div class="check-icon">✔</div>
                <span class="color-name">Azul</span>
            </div>

            <div class="color-box" onclick="seleccionarColor(this, 'Naranja')">
                <img src="img/naranja.jpg" alt="Naranja">
                <div class="check-icon">✔</div>
                <span class="color-name">Naranja</span>
            </div>

            <div class="color-box" onclick="seleccionarColor(this, 'Amarillo')">
                <img src="img/amarillo.jpg" alt="Amarillo">
                <div class="check-icon">✔</div>
                <span class="color-name">Amarillo</span>
            </div>

            <div class="color-box" onclick="seleccionarColor(this, 'Cafe')">
                <img src="img/cafe.jpg" alt="Café">
                <div class="check-icon">✔</div>
                <span class="color-name">Café</span>
            </div>

            <div class="color-box" onclick="seleccionarColor(this, 'Morado')">
                <img src="img/morado.jpg" alt="Morado">
                <div class="check-icon">✔</div>
                <span class="color-name">Morado</span>
            </div>
        </div>

            <p id="contadorColores" style="font-size: 14px; color: #555;">Seleccionados: 0 / 2</p>

            <button id="btnRegistrarFinal" class="btn-register" onclick="registrarUsuario()" disabled>
                Registrarse
            </button>
        </div>

        <div id="message"></div>
    </div>

<script>
    let datosUsuario = {};
    let coloresSeleccionados = [];
    const MAX_COLORES = 2;

    // --- BLOQUEO DE NÚMEROS EN TIEMPO REAL ---
    // Corregido: Obtenemos el elemento antes de usarlo
    const inputNombre = document.getElementById('nombre');
    
    inputNombre.addEventListener('input', function(e) {
        // Guardamos el valor original
        const valorAnterior = this.value;

        // Regex: busca todo lo que NO sea letra o espacio
        const caracteresNoPermitidos = /[^a-zA-ZñÑáéíóúÁÉÍÓÚ\s]/g;

        // Si hay caracteres prohibidos...
        if (caracteresNoPermitidos.test(this.value)) {
            // ... los borramos instantáneamente
            this.value = this.value.replace(caracteresNoPermitidos, '');
            
            // Efecto visual de error
            this.style.borderColor = "red";
            setTimeout(() => {
                this.style.borderColor = "#ddd"; 
            }, 500);
        }
    });
   
    // --- LÓGICA DEL PASO 1 ---
    document.getElementById('formStep1').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const nombre = document.getElementById('nombre').value;
        const nombreRegex = /^[a-zA-ZñÑáéíóúÁÉÍÓÚ\s]+$/;
            
            if (!nombreRegex.test(nombre)) {
                alert("El nombre no puede contener números ni caracteres especiales.");
                return; // Detiene el proceso
            }
        const correo = document.getElementById('correo').value;
        const contrasena = document.getElementById('contrasena').value;
        const confirmar = document.getElementById('confirmarContrasena').value;
        const presupuesto = document.getElementById('presupuesto').value;
        const codigoPareja = document.getElementById('codigoPareja').value;

        if(contrasena !== confirmar) {
            alert("Las contraseñas no coinciden");
            return;
        }

        datosUsuario = { nombre, correo, contrasena, presupuesto, codigoPareja };

        document.getElementById('step1').classList.remove('active');
        document.getElementById('step2').classList.add('active');
    });

    function irAlPaso1() {
        document.getElementById('step2').classList.remove('active');
        document.getElementById('step1').classList.add('active');
    }

    // --- LÓGICA DEL PASO 2 (COLORES) ---
    function seleccionarColor(elemento, nombreColor) {
        const index = coloresSeleccionados.indexOf(nombreColor);

        if(index > -1) {
            coloresSeleccionados.splice(index, 1);
            elemento.classList.remove('selected');
        } else {
            if(coloresSeleccionados.length < 2) {
                coloresSeleccionados.push(nombreColor);
                elemento.classList.add('selected');
            }
        }

        document.getElementById('contadorColores').innerText = `Seleccionados: ${coloresSeleccionados.length} / 2`;
        const btn = document.getElementById('btnRegistrarFinal');
        
        if(coloresSeleccionados.length === 2) {
            btn.disabled = false;
            btn.style.opacity = "1";
        } else {
            btn.disabled = true;
            btn.style.opacity = "0.5";
        }
    }

    // --- ENVÍO FINAL AL SERVIDOR ---
    async function registrarUsuario() {
        const messageDiv = document.getElementById('message');
        messageDiv.textContent = "Procesando...";
        
        const payload = {
            ...datosUsuario,
            codigo_pareja_input: datosUsuario.codigoPareja, // Mapeo importante para el backend
            colores: coloresSeleccionados
        };

        try {
            const response = await fetch('http://localhost:3000/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await response.json();

            if(response.ok) {
                messageDiv.style.color = 'green';
                messageDiv.textContent = "¡Registro Exitoso! Redirigiendo...";
                setTimeout(() => {
                    window.location.href = 'Login.html';
                }, 2000);
            } else {
                messageDiv.style.color = 'red';
                messageDiv.textContent = data.message;
            }

        } catch (error) {
            console.error(error);
            messageDiv.style.color = 'red';
            messageDiv.textContent = "Error al conectar con el servidor";
        }
    }
    // --- VALIDACIÓN ESTRICTA: SOLO NÚMEROS POSITIVOS ---
    // Evita +, -, e, puntos y cualquier otro símbolo
    const inputPresupuesto = document.getElementById('presupuesto');
    
    inputPresupuesto.addEventListener('input', function() {
        // Reemplaza todo lo que NO sea un número (0-9) por vacío
        this.value = this.value.replace(/[^0-9]/g, '');
    });

    // (Opcional) Bloqueo extra al presionar teclas para mejor sensación
    inputPresupuesto.addEventListener('keydown', function(e) {
        if (["-", "+", "e", ".", ","].includes(e.key)) {
            e.preventDefault();
        }
    });
</script>

</body>
</html>
