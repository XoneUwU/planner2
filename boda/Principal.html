<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Tablero - Wedding Planner</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background-color: #f0f2f5;
        }

        /* --- Barra Superior --- */
        .top-bar {
            background-color: #ffffff;
            padding: 15px 30px;
            border-bottom: 1px solid #ddd;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .user-info h3 { margin: 0; color: #333; }
        .user-info p { margin: 0; color: #555; font-size: 14px; }

        /* --- Menú Desplegable --- */
        .menu-dropdown { position: relative; display: inline-block; }
        .menu-btn {
            background-color: #068238c0;
            color: white;
            padding: 10px 15px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            background-color: #f9f9f9;
            min-width: 160px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
            z-index: 1;
            border-radius: 8px;
            overflow: hidden;
        }
        .dropdown-content a {
            color: black;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            font-size: 14px;
        }
        .dropdown-content a:hover { background-color: #ddd; }
        .menu-dropdown:hover .dropdown-content { display: block; }
        .menu-dropdown:hover .menu-btn { background-color: #0a5b0cd0; }
        
        /* --- Galería Estilo Pinterest --- */
        .gallery-container {
            column-count: 4;
            column-gap: 15px;
            padding: 20px;
            max-width: 1200px;
            margin: 20px auto;
        }

        .gallery-item {
            display: inline-block;
            width: 100%;
            margin-bottom: 15px;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            animation: fadeIn 0.5s ease-in;
            position: relative; /* Para posicionar el botón seleccionar */
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .gallery-item img { width: 100%; height: auto; display: block; }
        
        .gallery-item p {
            margin: 0; padding: 10px; background-color: #fff;
            text-align: center; font-weight: bold; color: #444; font-size: 0.9em;
        }

        /* --- Botón Seleccionar (NUEVO) --- */
        .select-btn {
            display: none; /* Oculto por defecto */
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 10;
        }
        .gallery-item:hover .select-btn { display: block; }
        .select-btn:hover { background-color: #c0392b; }
        
        /* --- Responsivo --- */
        @media (max-width: 1000px) { .gallery-container { column-count: 3; } }
        @media (max-width: 768px) { .gallery-container { column-count: 2; } .top-bar { flex-direction: column; gap: 10px; } }
        @media (max-width: 480px) { .gallery-container { column-count: 1; } }

        /* --- Indicador de Carga --- */
        .loading-indicator {
            display: none;
            text-align: center;
            padding: 20px;
            font-weight: bold;
            color: #555;
            font-size: 1.1em;
        }
        .loading-indicator.show { display: block; }
    </style>
</head>
<body>

    <header class="top-bar">
        <div class="user-info">
            <h3 id="userName">Cargando...</h3>
            <p id="userBudget">Presupuesto: $...</p>
        </div>
        
        <div class="menu-dropdown">
            <button class="menu-btn">Menú ▼</button>
            <div class="dropdown-content">
                <a href="Perfil.html">Mi Perfil</a>
                <a href="#" onclick="cerrarSesion()">Cerrar Sesión</a>
            </div>
        </div>
    </header>
    <aside class="sidebar centered" style="padding: 20px;  margin: 2px auto; background: white; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">    
        <label>Departamento</label>
            <select id="filterDpto">
                <option value="">Todos (Bolivia)</option>
                <option value="Cochabamba">Cochabamba</option>
                <option value="Santa Cruz">Santa Cruz</option>
                <option value="La Paz">La Paz</option>
                <option value="Tarija">Tarija</option>
                <option value="Chuquisaca">Chuquisaca</option>
                <option value="Potosí">Potosí</option>
                <option value="Oruro">Oruro</option>
                <option value="Beni">Beni</option>
                <option value="Pando">Pando</option>
            </select>
        <label>Capacidad (Salones)</label>
        <input type="number" id="filterCap" placeholder="Mínimo de personas">

        <label>Fecha Boda</label>
        <input type="date" id="filterDate">

        <button class="btn-filter" onclick="aplicarFiltros()">Aplicar Preferencias</button>
    </aside>

    <main class="gallery-container" id="galleryContainer">
        </main>

    <div class="loading-indicator" id="loadingIndicator">
        Cargando más ideas...
    </div>

<script>
    // --- VARIABLES GLOBALES ---
    let isLoading = false;
    const galleryContainer = document.getElementById('galleryContainer');
    const loadingIndicator = document.getElementById('loadingIndicator');
    
    // Aquí guardaremos los productos que nos envíe la base de datos
    let productosDelCatalogo = []; 
    let productosMostrados = 0;

    // --- 1. AL CARGAR LA PÁGINA ---
    window.addEventListener('DOMContentLoaded', async () => {
        // Verificar sesión
        const idUsuario = localStorage.getItem('usuarioId');
        if (!idUsuario) {
            window.location.href = 'Login.html';
            return;
        }

        // A. Cargar Info del Header (Nombre y Presupuesto)
        try {
            const response = await fetch(`http://localhost:3000/header-info/${idUsuario}`);
            const data = await response.json();

            if (data.success) {
                let presupuesto = parseFloat(data.usuario.presupuesto_estimado).toLocaleString('es-ES', { 
                    style: 'currency', currency: 'BOB' 
                });
                document.getElementById('userName').textContent = data.usuario.nombre;
                document.getElementById('userBudget').textContent = `Presupuesto: ${presupuesto}`;
            }
        } catch (error) {
            console.error("Error cargando header:", error);
        }

        // B. Cargar el Catálogo Personalizado (Productos reales)
        await loadInitialImages(idUsuario);
    });

    // --- 2. FUNCIÓN PARA PEDIR PRODUCTOS AL SERVIDOR ---
// 1. Modificar 'loadInitialImages' para aceptar filtros
// 1. FUNCIÓN DE CARGA INTELIGENTE
    async function loadInitialImages(idUsuario, filtros = {}) {
        loadingIndicator.classList.add('show');
        galleryContainer.innerHTML = ''; 
        productosMostrados = 0; 

        try {
            // Construimos la URL base
            let url = `http://localhost:3000/catalogo-personalizado/${idUsuario}?`;
            
            // Agregamos los parámetros si existen
            if (filtros.fecha) url += `&fecha=${filtros.fecha}`;
            if (filtros.dpto) url += `&dpto=${encodeURIComponent(filtros.dpto)}`;
            if (filtros.capacidad) url += `&capacidad=${filtros.capacidad}`;

            console.log("Consultando:", url); // Para depurar

            const response = await fetch(url);
            const data = await response.json();

            if (data.success && data.productos.length > 0) {
                productosDelCatalogo = data.productos;
                addImagesToDOM();
            } else {
                galleryContainer.innerHTML = `
                    <div style="text-align:center; width:100%; grid-column: 1 / -1; color:#666; padding: 40px;">
                        <h3>No hay resultados con estos filtros.</h3>
                        <p>Intenta cambiar el departamento o la fecha.</p>
                    </div>`;
            }

        } catch (error) {
            console.error(error);
            galleryContainer.innerHTML = "<p>Error de conexión.</p>";
        } finally {
            loadingIndicator.classList.remove('show');
        }
    }

    // 2. EL BOTÓN "APLICAR FILTROS"
    function aplicarFiltros() {
        const idUsuario = localStorage.getItem('usuarioId');
        
        // Capturamos los valores de los inputs del Sidebar
        const dpto = document.getElementById('filterDpto').value;
        const cap = document.getElementById('filterCap').value;
        const fecha = document.getElementById('filterDate').value;
        
        // Recargamos el catálogo enviando todo
        loadInitialImages(idUsuario, { 
            fecha: fecha,
            dpto: dpto,
            capacidad: cap
        });
    }

    // --- 3. FUNCIÓN PARA PINTAR LAS IMÁGENES (Paginación local) ---
    function addImagesToDOM() {
        const limite = Math.min(productosMostrados + 10, productosDelCatalogo.length);
        
        for (let i = productosMostrados; i < limite; i++) {
            const producto = productosDelCatalogo[i];
            const item = createImageItem(producto);
            galleryContainer.appendChild(item);
        }
        productosMostrados = limite;
    }

    // --- 4. CREAR EL HTML DE CADA PRODUCTO ---
    function createImageItem(producto) { 
        const item = document.createElement('div');
        item.className = 'gallery-item';

        // Datos reales de la BD
        // Nota: Si tu imagen en BD empieza con "boda/...", asegúrate que la ruta sea correcta
        // desde donde se ejecuta el HTML. Si no carga, probamos ajustando la ruta.
        const imageUrl = producto.url_imagen; 
        const titulo = producto.nombre_item;
        const precio = parseFloat(producto.costo_base).toLocaleString('es-ES', { style: 'currency', currency: 'BOB' });

        const img = document.createElement('img');
        img.src = imageUrl; 
        img.alt = titulo;
        
        // Si la imagen falla (ruta mal escrita en BD), muestra esto:
        img.onerror = function() { 
            this.src = 'https://placehold.co/400x300?text=Sin+Imagen'; 
        };

        const p = document.createElement('p');
        // Mostrar Título y Precio bonito
        p.innerHTML = `<strong>${titulo}</strong><br><span style="color:#27ae60; font-size:0.9em;">${precio}</span>`;

        const btn = document.createElement('button');
        btn.className = 'select-btn';
        btn.textContent = '❤ Seleccionar';
        
        // Al hacer clic, llamamos a guardarItem pasando TODO el objeto producto
        btn.onclick = () => guardarItem(producto); 

        item.appendChild(img);
        item.appendChild(p);
        item.appendChild(btn);
        
        return item;
    }

    // --- 5. SCROLL INFINITO ---
    window.addEventListener('scroll', () => {
        if (isLoading) return;
        // Si llegamos al final, cargamos más de la lista que ya tenemos en memoria
        if (window.innerHeight + window.scrollY >= document.documentElement.offsetHeight - 100) {
            addImagesToDOM();
        }
    });

    // --- 6. FUNCIÓN GUARDAR (CREAR RESERVA REAL) ---
    async function guardarItem(producto) { 
        const idUsuario = localStorage.getItem('usuarioId');
        if(!idUsuario) {
            alert("Debes iniciar sesión para guardar.");
            return;
        }

        try {
            const response = await fetch('http://localhost:3000/crear-reserva', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    id_usuario: idUsuario, 
                    // Enviamos los datos clave para la tabla Reserva
                    id_opcion: producto.id, 
                    tipo_opcion: producto.tipo, // 'Salon', 'Decoracion', etc.
                    monto_total: producto.costo_base, 
                    regla_pago_meses: producto.regla_pago_meses 
                })
            });

            const data = await response.json();
            if(data.success) {
                alert("¡Ítem guardado en tu perfil!");
                // Opcional: Cambiar el botón a "Guardado"
            } else {
                alert("Error al guardar: " + data.message);
            }
        } catch (e) {
            console.error(e);
            alert("Error de conexión.");
        }
    }

    // --- 7. CERRAR SESIÓN ---
    function cerrarSesion() {
        localStorage.clear();
        window.location.href = 'Login.html';
    }
</script>
</body>
</html>
